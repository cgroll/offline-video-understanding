[project]
name = "offline-video-understanding"
version = "0.1.0"
description = "Fully local video understanding: transcription, multimodal embeddings, VLM scene descriptions, chapters and a search GUI"
readme = "README.md"
authors = [
    { name = "cgroll" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0",
    "bitsandbytes>=0.50.2",
    "fastapi>=0.115",
    "lingua-language-detector>=2.2.0",
    "nemo_toolkit[asr]>=2.5",
    "numpy>=2.5.4",
    "onnx-asr[cpu,hub]>=0.12.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "reportlab>=4.2",
    "secretstorage>=3.3",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.66",
    "transformers>=5.19.0",
    "uvicorn>=0.30",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
ovu = "ovu.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ovu"
